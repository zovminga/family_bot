[project]
name = "family-bot"
version = "0.1.0"
description = "Telegram expense bot and offline HTML dashboard over Google Sheets"
readme = "README.md"
requires-python = ">=3.12,<3.14"
# Shared by the bot and the dashboard: both open the sheet through sheets.py.
dependencies = [
    "gspread>=6.1,<7",
    "google-auth>=2.40",
    "python-dotenv>=1.1",
    "requests>=2.32.4",
]

[project.scripts]
# Starts the bot (webhook on Render, polling locally). Render Start Command.
family-bot = "family_bot.bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["family_bot"]

[dependency-groups]
bot = [
    "python-telegram-bot[webhooks]>=22.2,<23",
    "python-dateutil>=2.9",
    # Voice input: offline speech-to-text; PyAV wheels bundle ffmpeg.
    "vosk>=0.3.44",
    "av>=14.0,<17",
    "anthropic>=0.40,<1",
]
dashboard = [
    "anthropic>=0.40,<1",
    "openai>=1.40,<3",
]
dev = [
    "pytest>=8.0",
    "pip-audit>=2.7",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
default-groups = ["bot", "dashboard", "dev"]
# Lock only versions that ship wheels for the dashboard Mac and the Linux host,
# so a package release without a wheel for one of them never enters the lock.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["dashboard/output"]

[tool.ruff.lint]
# Ruff's default set. Wider rules (I, UP, B) are open work in docs/STATUS.md.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Existing findings left in place so CI is green without touching product code.
# Remove an entry once its file is cleaned up.
"family_bot/bot.py" = ["F401"]
"family_bot/voice_input.py" = ["F401"]
"tests/known_bugs/test_bot_flows.py" = ["F401"]
"scripts/test_google_sheets.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
# Library modules only. family_bot/bot.py, family_bot/dashboard/build_dashboard.py and scripts/ are not checked.
files = [
    "family_bot/amount_input.py",
    "family_bot/analytics.py",
    "family_bot/auth.py",
    "family_bot/clock.py",
    "family_bot/config.py",
    "family_bot/conversation_states.py",
    "family_bot/dashboard/failure_alert.py",
    "family_bot/draft_expense.py",
    "family_bot/errors.py",
    "family_bot/expense.py",
    "family_bot/flow_preset.py",
    "family_bot/flows",
    "family_bot/navigation.py",
    "family_bot/per_user.py",
    "family_bot/photo_input.py",
    "family_bot/regular.py",
    "family_bot/sheet_data.py",
    "family_bot/sheets.py",
    "family_bot/text_input.py",
    "family_bot/voice_input.py",
]

[[tool.mypy.overrides]]
module = ["vosk", "dateutil", "dateutil.*"]
ignore_missing_imports = true

# Existing type errors, relaxed per module so CI is green without touching
# product code. Remove a code once the module no longer trips it.
[[tool.mypy.overrides]]
module = ["family_bot.analytics"]
disable_error_code = ["type-var", "return-value", "arg-type", "misc", "operator", "index"]

[[tool.mypy.overrides]]
module = ["family_bot.flow_preset"]
disable_error_code = ["union-attr"]

[[tool.mypy.overrides]]
module = ["family_bot.flows.manual"]  # bodies moved unchanged from unchecked bot.py
disable_error_code = ["union-attr", "index", "arg-type"]

[[tool.mypy.overrides]]
module = ["family_bot.navigation"]
disable_error_code = ["assignment", "union-attr"]

[[tool.mypy.overrides]]
module = ["family_bot.photo_input"]
disable_error_code = ["list-item"]

[[tool.mypy.overrides]]
module = ["family_bot.voice_input"]
disable_error_code = ["union-attr"]
